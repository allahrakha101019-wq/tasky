<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taskly</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg></div>
      <div><h1>Taskly</h1><p class="sub" id="today"></p></div>
    </div>
    <button type="button" id="theme" class="iconbtn" aria-label="Toggle dark mode"></button>
  </div>

  <div class="stats">
    <div class="stat t"><i><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></i><b id="st-total">0</b><span>Total tasks</span></div>
    <div class="stat a"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i><b id="st-active">0</b><span>Active tasks</span></div>
    <div class="stat d"><i><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></i><b id="st-done">0</b><span>Completed</span></div>
  </div>

  <div class="card">
    <h2>My tasks</h2>
    <form class="add" id="form">
      <input type="text" id="input" placeholder="What needs to be done?" aria-label="New task" autocomplete="off" maxlength="200">
      <div class="row">
        <input type="date" id="due" aria-label="Due date">
        <select id="prio" aria-label="Priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
      </div>
      <button class="addbtn" type="submit"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add task</button>
    </form>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
    </div>
    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">Active</button>
      <button data-f="done" aria-pressed="false">Completed</button>
    </div>
    <ul id="list"></ul>
    <div class="foot">
      <span id="count"></span>
      <button id="clear" type="button"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>Clear completed</button>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
